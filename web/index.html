<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>CHRONO FX</title>
<style>
 html,body{margin:0;height:100%;background:#0b0e14;color:#d8e0ea;
  font-family:"Segoe UI","Hiragino Kaku Gothic ProN",Meiryo,sans-serif}
 #log{position:absolute;top:0;left:0;right:0;bottom:104px;overflow-y:auto;
  padding:10px 12px;font-family:Consolas,Menlo,monospace;font-size:13px;
  white-space:pre-wrap;word-break:break-all;line-height:1.5}
 #log .big{color:#ffd166;font-weight:bold}
 #bar{position:absolute;left:0;right:0;bottom:0;padding:8px;
  background:#141a26;border-top:1px solid #2a3550}
 .row{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
 .q,.go{background:#1d2740;color:#9fb6e8;border:1px solid #33508c;
  border-radius:6px;padding:6px 10px;font-size:13px}
 .go{background:#2c4a86;color:#fff;font-weight:bold}
 #cmd{flex:1;min-width:120px;background:#0e1420;color:#e8eef8;
  border:1px solid #33508c;border-radius:6px;padding:8px;font-size:15px}
</style>
</head>
<body>
<div id="log"></div>
<div id="bar">
 <div class="row">
  <button class="q" data-c="n">n 次ニュース</button>
  <button class="q" data-c="p">p 相場</button>
  <button class="q" data-c="w">w 資産</button>
  <button class="q" data-c="l">l 一覧</button>
  <button class="q" data-c="bank">bank 標的</button>
  <button class="q" data-c="h">h ヘルプ</button>
  <button class="q" data-c="new">new 続行</button>
 </div>
 <div class="row">
  <input id="cmd" placeholder="例: b electrum 20 / sh pound 100 / n 50"
   autocapitalize="lowercase" autocomplete="off">
  <button class="go" id="go">送信</button>
 </div>
</div>
<script src="data.js"></script>
<script src="game.js"></script>
</body>
</html>
