<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHRONO FX 〜エレクトロン・スタンダード〜</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div id="yearwrap"><span id="year">—</span><div id="eqspark"></div></div>
  <div id="ticker"></div>
</header>
<main>
  <div id="left">
    <section id="era">
      <div id="clockrow">
        <button id="pp">⏸ 一時停止</button>
        <button id="s60">1年=60秒</button>
        <button id="s30">1年=30秒</button>
        <button id="s10">1年=10秒</button>
        <button id="s3">1年=3秒</button>
        <div id="tickwrap"><div id="tickbar"></div></div>
        <span id="nexty">—</span>
      </div>
      <button id="n1">▶ 1年</button>
      <button id="nn">⏩ 次のニュースまで</button>
      <button id="n10">＋10年</button>
      <button id="n100">＋100年</button>
      <button id="qbtn">🏳 降参</button>
      <input id="cmd" placeholder="上級者向けコマンド: bank / h / a BoE92 …">
      <div id="hintline"></div>
    </section>
    <section id="trade">
      <select id="cur"></select><span id="pxnow"></span>
      <input id="amt" type="number" placeholder="銀g" value="10">
      <button id="tb">買う</button><button id="tball">全額買</button>
      <button id="ts">売る</button><button id="tsall">全売</button>
      <button id="tsh">売り建て</button><button id="tcv">買戻</button>
    </section>
    <section>
      <h4>LIVE CHART <span id="chname" class="chname"></span></h4>
      <div id="chart"></div>
      <div class="clab" id="chlab"></div>
    </section>
    <section id="wallet">
      <div><div class="k">純資産</div><div class="v" id="net">—</div></div>
      <div><div class="k">銀</div><div class="v" id="silver">—</div></div>
      <div><div class="k">債務</div><div class="v" id="debt">—</div></div>
      <div><div class="k">倒した中銀</div><div class="v" id="fallen">0/8</div></div>
      <div><div class="k">レバレッジ <span id="lev">0倍</span></div>
        <div id="levbarwrap"><div id="levbar"></div></div></div>
    </section>
    <section><h4>POSITIONS</h4><div id="holdings"></div></section>
    <section><h4>CENTRAL BANKS（売り攻勢で準備金を溶かせ）</h4><div id="banks"></div></section>
  </div>
  <aside id="newscol">
    <h3>⚡ BREAKING NEWS — 歴史が動くたび速報が入る</h3>
    <div id="feed"></div>
  </aside>
</main>
<div id="log"></div>
<div id="overlay"><div class="panel">
  <h1 id="ovt"></h1><p id="ovs"></p><button id="again">もう一度歴史をやり直す</button>
</div></div>
<script src="data.js"></script>
<script src="game.js"></script>
<script src="ui.js"></script>
</body>
</html>
